version: '3.8'

services:
    database:
        image: postgres
        container_name: student_database
        environment:
            POSTGRES_DB: Student
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d Student -h localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
    
    migrator:
        build:
            context: .
            dockerfile: src/Services/StudentService/EduHub.StudentService.Infrastructure.Migrator/Dockerfile
        container_name: student_migrator
        depends_on:
            database:
                condition: service_healthy


