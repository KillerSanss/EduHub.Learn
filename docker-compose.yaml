version: '3.8'

services:
    database:
        image: postgres
        container_name: eduhub_database
        environment:
            POSTGRES_DB: Student
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - database_data:/var/lib/postgresql/data

    migrator:
        build:
            context: .
            dockerfile: src/Services/StudentService/Infrastructure/EduHub.StudentService.Infrastructure.Migrator/Dockerfile
        container_name: student_migrator
        depends_on:
            database:
                condition: service_healthy
        environment:
            - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=Student;Username=user;Password=password

volumes:
    database_data:
