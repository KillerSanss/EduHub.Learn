version: '3.8'

services:
    db:
        image: postgres
        environment:
            POSTGRES_DB: Student
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
    
    eduhub.studentservice.infrastructure.migrator:
        build:
            context: .
            dockerfile: src/Services/StudentService/EduHub.StudentService.Infrastructure.Migrator/Dockerfile
        depends_on:
            - db